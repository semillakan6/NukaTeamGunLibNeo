modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="NukaTeam's Gun Lib"
displayURL="https://discord.com/invite/njb6EKaDVJ"
logoFile="logo.png"
authors="${mod_authors}"
credits = "MrCrayfish, MigaMi"
description="Core for weapon mods"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config = "ntgl.mixin.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[1.21.1,)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="framework"
type="required"
versionRange="[0.6.16,)"
ordering="NONE"
side="BOTH"
#[[dependencies.${mod_id}]]
#modId="geckolib"
#mandatory=true
#versionRange="[4.8.2,)"
#ordering="AFTER"
#side="BOTH"
[[dependencies.${mod_id}]]
modId="controllable"
type="optional"
versionRange="[0.16.3,)"
ordering="AFTER"
side="CLIENT"
[[dependencies.${mod_id}]]
modId="bettercombat"
type="optional"
versionRange="[2.1.0,)"
ordering="NONE"
side="BOTH"
[modproperties.ntgl]
    catalogueImageIcon=""
