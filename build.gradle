plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//configurations {
//    library
//    implementation.extendsFrom library
//}

runs {
    // applies to all the run configs below
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

//        dependencies {
//            runtime project.configurations.library
//        }

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    flatDir {
        dirs 'libs'
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "SpongePowered"
        url = "https://repo.spongepowered.org/maven"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

// Pass -PnoOptionalCompat=true to runClient/runServer without Controllable, Better Combat, and Cloth (dev-only optional integrations).
def noOptionalCompatRuntime = project.hasProperty('noOptionalCompat') && project.property('noOptionalCompat').toString().equalsIgnoreCase('true')

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.8.4"
    implementation("com.eliotlash.mclib:mclib:20")

    implementation "curse.maven:framework-549225:6531439"
    implementation "curse.maven:sophisticated-core-618298:7698330"
    implementation "curse.maven:sophisticated-backpacks-422301:7700124"
    implementation "curse.maven:travelers-backpack-321117:7095271"
//    implementation "com.yyz:YyzsBackpack-neoforge:21.1.2"

    implementation "curse.maven:kotlin-for-forge-351264:6994056"
    implementation "curse.maven:fzzy-config-1005914:7085021"
    // Modrinth Subtle Effects 1.21.1-1.14.2 — matches current splash API (fluid id + SPLASH_EMITTER)
    implementation "maven.modrinth:subtle-effects:bTFc0rVM"

    compileOnly 'curse.maven:controllable-317269:6850105'
    if (!noOptionalCompatRuntime) {
        localRuntime 'curse.maven:controllable-317269:6850105'
    }
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1"

    compileOnly 'curse.maven:backpacked-352835:7573687'
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"

    compileOnly "mezz.jei:jei-1.21.1-common-api:19.25.0.322"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.25.0.322"

    // Better Combat (optional at runtime for players): compileOnly always; localRuntime unless -PnoOptionalCompat=true
    compileOnly "maven.modrinth:better-combat:2NyTus6V"
    if (!noOptionalCompatRuntime) {
        localRuntime "maven.modrinth:better-combat:2NyTus6V"
        // Cloth Config — Better Combat requires it; not pulled transitively into localRuntime from the Modrinth jar.
        localRuntime "maven.modrinth:cloth-config:izKINKFg"
    }
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.25.0.322"

    // Dev-only Create Gunsmithing Neo: sibling checkout by default; override with -PcreateGunsmithingNeoJar=C:/path/to/your.jar
    def createGunsmithingNeoJarProp = project.findProperty('createGunsmithingNeoJar')?.toString()?.trim()
    def createGunsmithingJarFile = createGunsmithingNeoJarProp ? file(createGunsmithingNeoJarProp) : file("${rootProject.projectDir}/../CreateGunsmithingNeo/build/libs/create-gunsmithing-1.4.2.1_Neo.jar")
    if (createGunsmithingJarFile.exists()) {
        localRuntime files(createGunsmithingJarFile)
    } else {
        logger.lifecycle("Create Gunsmithing jar not found (sibling ../CreateGunsmithingNeo/build/libs/ or -PcreateGunsmithingNeoJar=...); skipping localRuntime.")
    }

    // Create — mandatory for Create Gunsmithing (cgs). NeoForge 1.21.1, matches [6.0.10,) from cgs mods.toml.
    localRuntime "maven.modrinth:create:UjX6dr61"

    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

configurations.all {
    resolutionStrategy {
        // Принудительно используем только NeoForge версию
        force 'io.github.llamalad7:mixinextras-neoforge:0.5.0'
        // Исключаем Forge версию
        exclude group: 'io.github.llamalad7', module: 'mixinextras-forge'
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/** Fails the build if ntgl accidentally ships CGS classes — causes JPMS ResolutionException when both ntgl and cgs are loaded (split package). */
def jarTaskProvider = tasks.named('jar', Jar)
tasks.register('verifyNtglJarHasNoCgsPackage') {
    dependsOn jarTaskProvider
    def archiveFile = jarTaskProvider.flatMap { it.archiveFile }
    inputs.file(archiveFile)
    doLast {
        File jarFile = archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.startsWith('com/nukateam/cgs/')) {
                    throw new GradleException(
                            "Jar ${jarFile.name} contains forbidden split-package entry: ${entry.name}. " +
                                    "This ntgl artifact must only include com.nukateam.ntgl — rebuild from a clean tree without merging Create Gunsmithing output.")
                }
            }
        }
    }
}
tasks.named('jar').configure { finalizedBy 'verifyNtglJarHasNoCgsPackage' }

/** Log4j rolling file appenders expect logs/latest.log and logs/debug.log to exist before rollover; FML needs writable config. */
tasks.register('prepareRuns') {
    group = 'minecraft'
    description = 'Creates run directories and placeholder log files to avoid Log4j/FML startup failures on Windows.'
    doLast {
        ['client', 'server'].each { runName ->
            def base = file("runs/${runName}")
            ['logs', 'downloads', 'crash-reports', 'config', 'mods', 'defaultconfigs'].each { sub ->
                mkdir(new File(base, sub))
            }
            def logsDir = new File(base, 'logs')
            logsDir.mkdirs()
            ['latest.log', 'debug.log'].each { logName ->
                def f = new File(logsDir, logName)
                if (!f.exists()) {
                    f.createNewFile()
                }
            }
            def fml = new File(base, 'config/fml.toml')
            if (fml.exists() && !fml.canWrite()) {
                fml.setWritable(true)
            }
        }
    }
}

['runClient', 'runServer'].each { taskName ->
    def t = tasks.findByName(taskName)
    if (t != null) {
        t.dependsOn prepareRuns
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
